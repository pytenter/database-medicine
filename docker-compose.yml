services:
  db:
    image: ${OPENGAUSS_IMAGE:-enmotech/opengauss:5.0.1}
    container_name: pharmacy-opengauss
    restart: unless-stopped
    privileged: true
    user: root
    environment:
      GS_PASSWORD: ${DB_PASSWORD:-replace-with-a-secure-db-password}
      PGDATA: /var/lib/opengauss/data
      PGDATABASE: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - opengauss_data:/var/lib/opengauss/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.9-slim}
    container_name: pharmacy-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-secure-secret-key}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      DB_NAME: ${DB_NAME:-pharmacy_system}
      DB_USER: ${DB_USER:-gaussdb}
      DB_PASSWORD: ${DB_PASSWORD:-replace-with-a-secure-db-password}
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_DB: postgres
      INIT_DB_DEMO_DATA: ${INIT_DB_DEMO_DATA:-True}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
        VITE_API_BASE_URL: /api
    container_name: pharmacy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  opengauss_data:
